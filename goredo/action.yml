# This file defines the reusable action: kaihendry/actions/goredo/action.yml
name: "Install Goredo"
description: "Downloads, builds, installs the goredo build tool using Go, and verifies it."

inputs:
  goredo-version:
    description: "Version of goredo to download and install"
    required: false
    default: "2.9.1"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "stable"
        cache: true

    - name: Cache goredo binary
      uses: actions/cache@v5
      id: cache-goredo
      with:
        path: |
          /usr/local/bin/goredo
          /usr/local/bin/goredo-*
        key: goredo-binary-${{ runner.os }}-${{ inputs.goredo-version }}

    # Install zstd only if not already present (Ubuntu 22.04+ runners include it)
    - name: Ensure zstd is available
      if: steps.cache-goredo.outputs.cache-hit != 'true'
      shell: bash
      run: command -v unzstd || sudo apt-get install -y --no-install-recommends zstd

    # Import goredo maintainer's PGP key for signature verification
    - name: Import goredo PGP key
      if: steps.cache-goredo.outputs.cache-hit != 'true'
      shell: bash
      run: gpg --keyserver hkps://keys.openpgp.org --recv-keys 7531BB84FAF0BF35960C63B93A528DDE952C7E93

    # Download tarball and signature in parallel from HTTPS mirror: https://goredo.dabase.com/
    - name: Download goredo v${{ inputs.goredo-version }} source and signature
      if: steps.cache-goredo.outputs.cache-hit != 'true'
      shell: bash
      run: |
        BASE="https://goredo.dabase.com/download/goredo-${{ inputs.goredo-version }}.tar.zst"
        curl -fsSL -O "$BASE" -O "$BASE.asc"

    - name: Verify PGP signature
      if: steps.cache-goredo.outputs.cache-hit != 'true'
      shell: bash
      run: gpg --verify "goredo-${{ inputs.goredo-version }}.tar.zst.asc" "goredo-${{ inputs.goredo-version }}.tar.zst"

    - name: Extract, build, and install goredo
      if: steps.cache-goredo.outputs.cache-hit != 'true'
      shell: bash
      run: |
        src="${{ runner.temp }}/goredo-src"
        mkdir -p "$src"
        tar --use-compress-program unzstd -xf "goredo-${{ inputs.goredo-version }}.tar.zst" --strip-components=1 -C "$src"
        (cd "$src/src" && go build -mod=vendor)
        sudo cp "$src/src/goredo" /usr/local/bin/
        echo "/usr/local/bin" >> $GITHUB_PATH
        cd /usr/local/bin && sudo ./goredo -symlinks

    - name: Recreate symlinks (cache hit)
      if: steps.cache-goredo.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "/usr/local/bin" >> $GITHUB_PATH
        cd /usr/local/bin && sudo ./goredo -symlinks
